# Linux/Wine only; no Windows VM, privileged mode, ports or Docker socket.
services:
  xbox360-xex-builder:
    container_name: xbox360-xex-builder
    image: local/omni360-wine-builder:1
    build:
      context: .
      dockerfile: Dockerfile.wine
    init: true
    restart: unless-stopped
    network_mode: none
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
    tmpfs:
      - /tmp:mode=1777,size=512m
    environment:
      HOME: /build/home
      WINEPREFIX: /build/wine
      WINEARCH: win32
      WINEDEBUG: '-all'
      XEDK: 'Z:\xdk'
      OMNI360_BUILD_JOBS: '4'
    volumes:
      - ${OMNI360_XDK_DIR:-/opt/xbox360/xex-builder/sdk}:/xdk:ro
      - ${OMNI360_SOURCE_DIR:-/opt/xbox360/xex-builder/source}:/source:ro
      - ${OMNI360_BUILD_DIR:-/opt/xbox360/xex-builder/build}:/build
    labels:
      traefik.enable: 'false'
      diun.enable: 'false'
    healthcheck:
      test: [CMD, python3, /opt/builder/build.py, --check-sdk]
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 2
    command: [sleep, infinity]

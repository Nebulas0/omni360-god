name: Foundry protocol and server checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/app/requirements.txt
      - name: Server regression and API contract tests
        env:
          PYTHONPATH: server/app
          START_BACKGROUND: 'false'
          WORK_DIR: /tmp/foundry-ci-work
          OUTPUT_DIR: /tmp/foundry-ci-output
          CONSOLE_CONTRACT_FIXTURES: tools/test_foundry/fixtures
        run: python -m pytest -q server/app/tests
      - name: Compile portable client protocol with C++03
        run: python tools/test_foundry/run.py
      - name: Build translation and release safety tests
        run: python -m unittest discover -s builder -p "test_*.py" -v
      - name: Validate Visual Studio project files
        run: python -c "import xml.etree.ElementTree as E; E.parse('XboxTLS2.vcxproj'); E.parse('XboxTLS2.vcxproj.filters')"

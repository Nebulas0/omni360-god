name: Signed XEX release (ZenServer Wine)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundry-native-release
  cancel-in-progress: true
jobs:
  release:
    if: github.repository == 'Nebulas0/omni360-god' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for server build and verify the signed XEX
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python builder/wait_for_release.py --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: Omni360-GoD-signed-XEX
          path: |
            Release/Omni360.xex
            Release/Omni360.xex.sig
            Release/build.json
            Release/SHA256SUMS
          if-no-files-found: ignore
